<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EzySales Calculator Suite</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<a href="../index.html" class="back-link">🏠 Main Menu</a>

<div class="hero">

<div class="hero-icon">🧮</div>

<h1>EzySales Calculator Suite</h1>

<p>
Professional Property Calculators for Real Estate Agents
</p>

</div>

<div class="tab-buttons">

<button class="tab active" onclick="showTab(event,'dsr')">
📊 DSR
</button>

<button class="tab" onclick="showTab(event,'loan')">
🏠 Loan
</button>

<button class="tab" onclick="showTab(event,'roi')">
📈 ROI
</button>

<button class="tab" onclick="showTab(event,'seller')">
🏡 Seller
</button>

</div>

<!-- ================= DSR ================= -->

<div id="dsr" class="card">

<h2>📊 DSR Calculator</h2>

<label>Monthly Income (RM)</label>
<input id="salary" type="number" placeholder="5000">

<label>Existing Commitments (RM)</label>
<input id="commitment" type="number" placeholder="1200">

<button onclick="calcDSR()">Calculate</button>

<div id="dsrResult" class="result"></div>

</div>

<!-- ================= LOAN ================= -->

<div id="loan" class="card hidden">

<h2>🏠 Home Loan Calculator</h2>

<label>Property Price (RM)</label>

<input id="loanPrice" type="number">

<label>Interest Rate (%)</label>

<input id="loanRate" type="number">

<label>Loan Tenure (Years)</label>

<input id="loanYears" type="number">

<button onclick="calcLoan()">Calculate</button>

<div id="loanResult" class="result"></div>

</div>

<!-- ================= ROI ================= -->

<div id="roi" class="card hidden">

<h2>📈 ROI Calculator</h2>

<label>House Price</label>
<input id="housePrice" type="number">

<label>Down Payment (Cash Invested, RM)</label>
<input id="downPayment" type="number">

<label>Monthly Rental</label>
<input id="monthlyRent" type="number">

<label>Loan Instalment</label>
<input id="loanInstallment" type="number">

<label>Maintenance Fee</label>
<input id="maintenanceFee" type="number">

<label>Other Monthly Cost</label>
<input id="otherCost" type="number">

<button onclick="calcROI()">Calculate</button>

<div id="roiResult" class="result"></div>

</div>

<!-- ================= SELLER ================= -->

<div id="seller" class="card hidden">

<h2>🏡 Seller Cost Calculator</h2>

<label>Buying Price</label>
<input id="buyPrice" type="number">

<label>Selling Price</label>
<input id="sellPrice" type="number">

<label>Current Loan Balance</label>
<input id="loanBalance" type="number">

<label>Years Owned</label>

<select id="yearsOwned">

<option>Below 3 Years</option>
<option>4 Years</option>
<option>5 Years</option>
<option>More than 5 Years</option>

</select>

<label>Who Uses Lawyer?</label>

<select id="lawyerType">

<option>Buyer Lawyer</option>
<option>Own Lawyer</option>

</select>

<label>Bank Penalty (%)</label>

<input id="bankPenalty" type="number" value="0.5">

<button onclick="calcSeller()">Calculate</button>

<div id="sellerResult" class="result"></div>

</div>

</div>

<script>

function showTab(event,tab){

document.querySelectorAll(".card").forEach(card=>{
card.classList.add("hidden");
});

document.getElementById(tab).classList.remove("hidden");

document.querySelectorAll(".tab").forEach(btn=>{
btn.classList.remove("active");
});

event.currentTarget.classList.add("active");

}

</script>

<script src="dsr.js"></script>
<script src="loan.js"></script>
<script src="roi.js"></script>
<script src="seller.js"></script>

</body>

</html>
