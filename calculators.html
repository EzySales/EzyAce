<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculators - EzySales Academy</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:Inter,sans-serif;
  background:#0b0d11;
  color:white;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:30px;
}

h1{
  margin-bottom:30px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
  gap:20px;
}

.card{
  max-width:900px;
  margin:0 auto;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:18px;
  padding:20px;
}
  
input,select{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border:none;
  border-radius:10px;
}

button{
    padding:12px;
    border:none;
    border-radius:10px;
    font-weight:700;
    cursor:pointer;
}

  .card button{
    background:#00c8ff;
    color:black;
}

.result{
  margin-top:15px;
  font-size:16px;
  font-weight:600;
}

  .tab-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:15px;
  justify-content:center;
  margin-bottom:25px;
}

.tab-buttons button{
    width:auto;
    min-width:180px;
    max-width:220px;

    background:rgba(255,255,255,0.08);
    color:white;
    border:1px solid rgba(255,255,255,0.1);
}

.tab-buttons button:hover{
  background:#00c8ff;
  color:black;
}

.tab-buttons{
    flex-wrap:nowrap;
    justify-content:center;
    gap:8px;
}

.tab-buttons button{
    width:auto;
    min-width:100px;
    font-size:13px;
    padding:10px;
}

  .tab-buttons button{
    width:45%;
    min-width:auto;
    font-size:14px;
    padding:10px;
  }

}
  
</style>
</head>

<body>

<div class="container">

<h1>🧮 EzySales Calculators</h1>
  
<div class="tab-buttons">
<button onclick="showTab('dsr')">📊 DSR</button>
<button onclick="showTab('loan')">🏠 Home Loan</button>
<button onclick="showTab('seller')">🏡 Seller</button>
</div>

<div id="loan" class="card">

<h2>🏠 Loan Calculator</h2>

<select id="propertyType">
  <option value="subsale">🏠 Subsale</option>
  <option value="new">🏢 New Project</option>
</select>

<input id="loanPrice" type="number" placeholder="Property Price">

<input id="loanRate" type="number" placeholder="Interest Rate (%)">

<input id="loanYears" type="number" placeholder="Loan Tenure (Years)">

<select id="loanMargin">
  <option value="90">90% Loan Margin</option>
  <option value="95">95% Loan Margin</option>
  <option value="100">100% Loan Margin</option>
</select>

<button onclick="calcLoan()">Calculate</button>

<div class="result" id="loanResult"></div>

</div>

<div id="dsr" class="card" style="display:none">

<h2>📊 DSR Calculator</h2>

<input id="salary" type="number" placeholder="Monthly Income">
<input id="commitment" type="number" placeholder="Monthly Commitments">

<button onclick="calcDSR()">Calculate</button>

<div class="result" id="dsrResult"></div>

</div>

<div id="seller" class="card" style="display:none">

<h2>🏡 Seller Cost Calculator</h2>

<input id="sellerPrice" type="number" placeholder="Selling Price">

<select id="lawyerType">
<option value="own">Own Lawyer</option>
<option value="buyer">Buyer Lawyer</option>
</select>

<button onclick="calcSeller()">Calculate</button>

<div class="result" id="sellerResult"></div>

</div>
</div>
</div>

<script>

function money(x){
 return "RM " + Number(x).toLocaleString('en-MY',{minimumFractionDigits:2});
}

function calcLoan(){

 let price = parseFloat(document.getElementById('loanPrice').value);
 let rate = parseFloat(document.getElementById('loanRate').value)/100/12;
 let months = parseFloat(document.getElementById('loanYears').value)*12;

 let monthly =
 (price*rate*Math.pow(1+rate,months)) /
 (Math.pow(1+rate,months)-1);

 document.getElementById('loanResult').innerHTML =
 "Monthly Installment:<br><b>"+money(monthly)+"</b>";
}

function calcLoan(){

 let price = parseFloat(document.getElementById('loanPrice').value);
 let rate = parseFloat(document.getElementById('loanRate').value)/100/12;
 let years = parseFloat(document.getElementById('loanYears').value);

 let propertyType = document.getElementById('propertyType').value;
 let margin = parseFloat(document.getElementById('loanMargin').value);

 let loanAmount = price * (margin/100);
 let downpayment = price - loanAmount;

 let months = years * 12;

 let monthly =
 (loanAmount * rate * Math.pow(1+rate,months)) /
 (Math.pow(1+rate,months)-1);

 let lawyerFee = "";
 let valuationFee = "";

 if(price <= 200000){
   lawyerFee = "RM20,000";
 }
 else if(price <= 400000){
   lawyerFee = "RM25,000";
 }
 else if(price <= 500000){
   lawyerFee = "RM25,000 - RM30,000";
 }
 else{
   lawyerFee = "RM40,000+";
 }

 if(price <= 300000){
   valuationFee = "RM1,500 - RM2,000";
 }
 else{
   valuationFee = "RM2,000 - RM3,000";
 }

 let result = `
 <b>Monthly Installment:</b><br>
 ${money(monthly)}

 <br><br>

 <b>Loan Amount:</b><br>
 ${money(loanAmount)}

 <br><br>

 <b>Downpayment:</b><br>
 ${money(downpayment)}
 `;

 if(propertyType === "subsale"){

   result += `

   <br><br>

   <b>Lawyer Fee Estimate:</b><br>
   ${lawyerFee}

   <br><br>

   <b>Valuation Fee Estimate:</b><br>
   ${valuationFee}

   <br><br>

   ⚠ Subject to CCRIS, CTOS & bank approval.
   `;
 }
 else{

   result += `

   <br><br>

   <b>SPA Legal Fee:</b><br>
   ABSORBED BY DEVELOPER ✅

   <br><br>

   <b>Valuation Fee:</b><br>
   ABSORBED ✅

   <br><br>

   ⚠ Subject to CCRIS, CTOS & bank approval.
   `;
 }

 document.getElementById('loanResult').innerHTML = result;

}

 let dsr = (commitment / income) * 100;

 let maxCommitment = income * 0.65;
 let availableRepayment = maxCommitment - commitment;

 let lowPrice = availableRepayment * 180;
 let highPrice = availableRepayment * 220;

 let status = "";
 let color = "";

 if(dsr <= 30){
   status = "Excellent Eligibility";
   color = "#00c853";
 }
 else if(dsr <= 50){
   status = "Good Eligibility";
   color = "#43a047";
 }
 else if(dsr <= 70){
   status = "Moderate Eligibility";
   color = "#fb8c00";
 }
 else{
   status = "High Risk";
   color = "#e53935";
 }

 document.getElementById('dsrResult').innerHTML = `
   <div style="
      background:${color};
      padding:15px;
      border-radius:12px;
      margin-top:15px;
      color:white;
      font-weight:700;
   ">
      ${status}
   </div>

   <br>

   <b>Current DSR:</b> ${dsr.toFixed(2)}%

   <br><br>

   <b>Max Monthly Repayment Allowed:</b><br>
   ${money(availableRepayment)}

   <br><br>

   <b>Estimated Property Price You Can Buy:</b><br>
   ${money(lowPrice)} - ${money(highPrice)}
 `;
}

function calcCommission(){

 let sell = parseFloat(document.getElementById('sellPrice').value);
 let percent = parseFloat(document.getElementById('commPercent').value);

 let commission = sell*(percent/100);

 document.getElementById('commResult').innerHTML =
 "Commission:<br><b>"+money(commission)+"</b>";
}

function calcSeller(){

 let sell = parseFloat(document.getElementById('sellerPrice').value);
 let lawyer = document.getElementById('lawyerType').value;

 let lawyerFee = 0;
 let disbursement = 0;

 if(lawyer==="own"){
   lawyerFee = sell * 0.01;
   disbursement = sell * 0.005;
 }else{
   lawyerFee = sell * 0.0075;
 }

 let total = lawyerFee + disbursement;

 document.getElementById('sellerResult').innerHTML =
 "Lawyer Fee: "+money(lawyerFee)+"<br>" +
 "Disbursement: "+money(disbursement)+"<br><br>" +
 "<b>Total Cost: "+money(total)+"</b>";
}

function showTab(tab){

document.getElementById('loan').style.display='none';
document.getElementById('dsr').style.display='none';
document.getElementById('seller').style.display='none';

document.getElementById(tab).style.display='block';

}
  
</script>

</body>
</html>
