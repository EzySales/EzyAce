<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EzySales Sales Toolkit</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="templates.css">

</head>

<body>

<div class="container">

<div class="hero">

<h1>🧰 Sales Toolkit</h1>

<p>
Copy professional scripts, captions and replies in one click.
</p>

</div>

<!-- SEARCH -->

<div class="search-box">

<input
type="text"
id="search"
placeholder="🔍 Search templates...">

</div>

<!-- CATEGORY -->

<div class="categories">

<button class="category active" onclick="filterCards('all')">
All
</button>

<button class="category" onclick="filterCards('marketing')">
Marketing
</button>

<button class="category" onclick="filterCards('owner')">
Owner
</button>

<button class="category" onclick="filterCards('buyer')">
Buyer
</button>

<button class="category" onclick="filterCards('whatsapp')">
WhatsApp
</button>

<button class="category" onclick="filterCards('legal')">
Legal
</button>

</div>

<!-- CARDS -->

<div class="grid">

<!-- CARD 1 -->

<div
class="card"
data-category="buyer whatsapp">

<h3>👨 New Buyer Enquiry</h3>

<p>
Perfect reply for first enquiry.
</p>

<textarea readonly>

Hi {{Name}},

Thank you for your enquiry.

May I know which area and budget you are looking for?

I'll recommend the best properties that suit your requirements.

Looking forward to assisting you.

</textarea>

<button onclick="copyTemplate(this)">

📋 Copy Template

</button>

</div>

<!-- CARD 2 -->

<div
class="card"
data-category="marketing">

<h3>🏠 Property Listing</h3>

<p>
Professional Facebook listing.
</p>

<textarea readonly>

🏠 {{PROPERTY}}

📍 {{AREA}}

💰 RM {{PRICE}}

🛏 {{BEDROOM}}

🚿 {{BATHROOM}}

🚗 {{PARKING}}

Interested?

PM me today.

</textarea>

<button onclick="copyTemplate(this)">

📋 Copy Template

</button>

</div>

<!-- CARD 3 -->

<div
class="card"
data-category="owner">

<h3>🏡 Owner First Contact</h3>

<p>

Cold approach to owner.

</p>

<textarea readonly>

Hi,

I noticed your property around {{Area}}.

I'm currently assisting several buyers looking there.

Would you be interested in selling?

Thank you.

</textarea>

<button onclick="copyTemplate(this)">

📋 Copy Template

</button>

</div>

<!-- CARD 4 -->

<div
class="card"
data-category="legal">

<h3>📄 Explain SPA</h3>

<p>

Simple explanation.

</p>

<textarea readonly>

SPA means Sale & Purchase Agreement.

It is the legal agreement between buyer and seller before ownership transfer.

</textarea>

<button onclick="copyTemplate(this)">

📋 Copy Template

</button>

</div>

</div>

</div>

<!-- TOAST -->

<div id="toast">

✅ Template Copied

</div>

<script src="templates.js"></script>

</body>

</html>
