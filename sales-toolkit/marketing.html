<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Marketing Generator | EzySales Academy</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="toolkit.css">

</head>

<body>

<div class="container">

<div class="hero">

<div class="hero-icon">
📢
</div>

<h1>Marketing Generator</h1>

<p>
Create professional property copywriting in less than 30 seconds.
</p>

</div>

<!-- PROPERTY TYPES -->

<div class="card">

<h2>Step 1 • Choose Property Type</h2>

<div class="property-grid">

<div class="property-card active">
🏢
<span>Apartment</span>
</div>

<div class="property-card">
🏠
<span>Landed</span>
</div>

<div class="property-card">
🏬
<span>Shoplot</span>
</div>

<div class="property-card">
🌾
<span>Land</span>
</div>

<div class="property-card">
🏭
<span>Factory</span>
</div>

<div class="property-card">
🏢
<span>Commercial</span>
</div>

</div>

</div>

<!-- PROPERTY DETAILS -->

<div class="card">

<h2>Step 2 • Property Details</h2>

<div class="form-grid">

<div>

<label>Project Name</label>

<input
type="text"
id="project"
placeholder="e.g. Bukit Sentosa">

</div>

<div>

<label>Location</label>

<input
type="text"
id="location"
placeholder="e.g. Rawang">

</div>

<div>

<label>Price (RM)</label>

<input
type="number"
id="price">

</div>

<div>

<label>Bedrooms</label>

<input
type="number"
id="bedroom">

</div>

<div>

<label>Bathrooms</label>

<input
type="number"
id="bathroom">

</div>

<div>

<label>Car Parks</label>

<input
type="number"
id="parking">

</div>

<div>

<label>Built Up</label>

<input
type="text"
id="buildup"
placeholder="e.g. 1,400 sqft">

</div>

<div>

<label>Land Size</label>

<input
type="text"
id="landsize"
placeholder="22 x 75">

</div>

</div>

</div>
